plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
    id 'com.replaymod.preprocess-root' version '221276c7d4'
    id 'com.replaymod.preprocess' version '221276c7d4' apply false
}

preprocess {
    strictExtraMappings = true

    // Version graph, derived from the versions/<mc> directories. Ints encode
    // major*10000 + minor*100 + patch, so source conditions can be written as
    // e.g. `//#if MC>=26.1` (= 260100); the modern two-part scheme (26.1)
    // parses as major.minor with patch 0.
    // mappings arg: non-null = obfuscated (joined via intermediary/mojmap),
    // null = unobfuscated (26.1+ ships official names; no intermediary, so
    // those links join by shared mojang names instead).
    def nodes = []
    file('versions').eachDir { dir ->
        def parts = dir.name.split(/\./)
        int major = parts[0] as int
        int minor = parts.length > 1 ? parts[1] as int : 0
        int patch = parts.length > 2 ? parts[2] as int : 0
        nodes << createNode(dir.name, major * 10000 + minor * 100 + patch, major >= 26 ? null : 'mojang')
    }
    nodes.sort { it.mcVersion }

    // Link newest -> oldest, so versions/mapping-<newer>-<older>.txt files keep
    // newer names in the left column. Pairwise intermediary joins already capture
    // most renames; an extra-mappings file exists only where the join falls short
    // (absent file = no extra mappings for that link).
    for (int i = nodes.size() - 1; i > 0; --i) {
        def extraMappings = file("versions/mapping-${nodes[i].project}-${nodes[i - 1].project}.txt")
        nodes[i].link(nodes[i - 1], extraMappings.exists() ? extraMappings : null)
    }
}

// Aggregates every version's mod jar into the root build/libs for CI.
def collectJars = tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Collect all per-version mod jars into build/libs.'
    into layout.buildDirectory.dir('libs')
}
subprojects { p ->
    p.afterEvaluate {
        def jarTask = p.tasks.findByName('remapJar') ?: p.tasks.findByName('jar')
        if (jarTask != null) {
            collectJars.configure { from(jarTask) }
        }
    }
}
