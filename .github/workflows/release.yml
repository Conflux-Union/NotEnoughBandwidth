name: Release

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      has_releases: ${{ steps.scan.outputs.has_releases }}
      date_tag: ${{ steps.scan.outputs.date_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan branches
        id: scan
        run: |
          DATE_TAG="release-$(date +%Y.%m.%d)"
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT

          includes=()
          for branch in $(git branch -r | grep -E '^\s*origin/[0-9]' | sed 's|.*origin/||'); do
            MOD_VERSION=$(git show "origin/${branch}:gradle.properties" 2>/dev/null | grep '^mod_version=' | cut -d'=' -f2)
            MC_VERSION=$(git show "origin/${branch}:gradle.properties" 2>/dev/null | grep '^minecraft_version=' | cut -d'=' -f2)
            [ -z "$MOD_VERSION" ] && continue
            if ! git rev-parse "v$MOD_VERSION" >/dev/null 2>&1; then
              echo "  queued: $branch (v$MOD_VERSION)"
              includes+=("{\"branch\":\"$branch\",\"mod_version\":\"$MOD_VERSION\",\"mc_version\":\"$MC_VERSION\"}")
            else
              echo "  skipped: $branch (v$MOD_VERSION already tagged)"
            fi
          done

          if [ ${#includes[@]} -eq 0 ]; then
            echo "No branches need releasing."
            echo "has_releases=false" >> $GITHUB_OUTPUT
          else
            printf -v joined '%s,' "${includes[@]}"
            echo "matrix={\"include\":[${joined%,}]}" >> $GITHUB_OUTPUT
            echo "has_releases=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Collect jar and changelog
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | grep -v javadoc | head -1)
          mkdir -p /tmp/artifacts

          cp "$JAR" /tmp/artifacts/

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          {
            echo "### Minecraft ${{ matrix.mc_version }} (mod ${{ matrix.mod_version }})"
            if [ -z "$LAST_TAG" ]; then
              git log HEAD --pretty=format:"- %s (%h)" --no-merges
            else
              git log "${LAST_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo ""
          } > /tmp/artifacts/changelog-${{ matrix.branch }}.md

      - name: Tag branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ matrix.mod_version }}"
          git push origin "v${{ matrix.mod_version }}"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: vD8fMHSr
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: /tmp/artifacts/*.jar
          name: Not Enough Bandwidth ${{ matrix.mod_version }}
          version: ${{ matrix.mod_version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ matrix.mc_version }}
          dependencies: |
            fabric-api(required)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.branch }}
          path: /tmp/artifacts/

  publish:
    needs: [check, build]
    if: needs.check.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: /tmp/artifacts
          merge-multiple: true

      - name: Assemble release body
        id: body
        run: |
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -d '/+=')
          {
            echo "body<<$EOF_MARKER"
            echo "## Not Enough Bandwidth"
            echo ""
            echo "Fabric Loader >= 0.18.0 | Fabric API required"
            echo ""
            for f in $(ls /tmp/artifacts/changelog-*.md 2>/dev/null | sort); do
              cat "$f"
            done
            echo "$EOF_MARKER"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.date_tag }}
          name: Not Enough Bandwidth ${{ needs.check.outputs.date_tag }}
          body: ${{ steps.body.outputs.body }}
          files: /tmp/artifacts/*.jar
          draft: false
          prerelease: false
