name: Release

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      has_releases: ${{ steps.build_matrix.outputs.has_releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find branches needing release
        id: build_matrix
        run: |
          includes=()
          for branch in $(git branch -r | grep -E '^\s*origin/[0-9]' | sed 's|.*origin/||'); do
            MOD_VERSION=$(git show "origin/${branch}:gradle.properties" 2>/dev/null | grep '^mod_version=' | cut -d'=' -f2)
            MC_VERSION=$(git show "origin/${branch}:gradle.properties" 2>/dev/null | grep '^minecraft_version=' | cut -d'=' -f2)
            [ -z "$MOD_VERSION" ] && continue
            if ! git rev-parse "v$MOD_VERSION" >/dev/null 2>&1; then
              echo "Branch $branch: v$MOD_VERSION not tagged, queuing for release."
              includes+=("{\"branch\":\"$branch\",\"mod_version\":\"$MOD_VERSION\",\"mc_version\":\"$MC_VERSION\"}")
            else
              echo "Branch $branch: v$MOD_VERSION already tagged, skipping."
            fi
          done
          if [ ${#includes[@]} -eq 0 ]; then
            echo "No branches need releasing."
            echo "has_releases=false" >> $GITHUB_OUTPUT
          else
            printf -v joined '%s,' "${includes[@]}"
            echo "matrix={\"include\":[${joined%,}]}" >> $GITHUB_OUTPUT
            echo "has_releases=true" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check
    if: needs.check.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Locate jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | grep -v javadoc | head -1)
          echo "path=$JAR" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            HEADER="Full changelog (initial release):"
          else
            RANGE="${LAST_TAG}..HEAD"
            HEADER="Changes since ${LAST_TAG}:"
          fi

          COMMITS=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges)

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -d '/+=')
          {
            echo "body<<$EOF_MARKER"
            echo "## Not Enough Bandwidth ${{ matrix.mod_version }}"
            echo ""
            echo "Minecraft: **${{ matrix.mc_version }}** | Fabric Loader >= 0.18.0 | Fabric API required"
            echo ""
            echo "### $HEADER"
            echo "$COMMITS"
            echo "$EOF_MARKER"
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ matrix.mod_version }}"
          git push origin "v${{ matrix.mod_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.mod_version }}
          name: Not Enough Bandwidth ${{ matrix.mod_version }}
          body: ${{ steps.changelog.outputs.body }}
          files: ${{ steps.jar.outputs.path }}
          draft: false
          prerelease: ${{ contains(matrix.mod_version, 'alpha') || contains(matrix.mod_version, 'beta') || contains(matrix.mod_version, 'rc') }}
