name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from gradle.properties
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$MOD_VERSION" >> $GITHUB_OUTPUT

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ steps.version.outputs.mod_version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.mod_version }} already exists. Bump mod_version in gradle.properties before releasing."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Locate jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | grep -v javadoc | head -1)
          echo "path=$JAR" >> $GITHUB_OUTPUT
          echo "name=$(basename $JAR)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            HEADER="Full changelog (initial release):"
          else
            RANGE="${LAST_TAG}..HEAD"
            HEADER="Changes since ${LAST_TAG}:"
          fi

          COMMITS=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges)

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -d '/+=')
          {
            echo "body<<$EOF_MARKER"
            echo "## Not Enough Bandwidth ${{ steps.version.outputs.mod_version }}"
            echo ""
            echo "Minecraft: **${{ steps.version.outputs.mc_version }}** | Fabric Loader >= 0.18.0 | Fabric API required"
            echo ""
            echo "### $HEADER"
            echo "$COMMITS"
            echo "$EOF_MARKER"
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.mod_version }}"
          git push origin "v${{ steps.version.outputs.mod_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.mod_version }}
          name: Not Enough Bandwidth ${{ steps.version.outputs.mod_version }}
          body: ${{ steps.changelog.outputs.body }}
          files: ${{ steps.jar.outputs.path }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.mod_version, 'alpha') || contains(steps.version.outputs.mod_version, 'beta') || contains(steps.version.outputs.mod_version, 'rc') }}
