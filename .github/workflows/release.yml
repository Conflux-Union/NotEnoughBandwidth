name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.meta.outputs.mod_version }}
      tag: ${{ steps.meta.outputs.tag }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, tag and matrix
        id: meta
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          if [ -z "$MOD_VERSION" ]; then
            echo "::error::mod_version not found in root gradle.properties"
            exit 1
          fi
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v$MOD_VERSION"
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists; bump mod_version in gradle.properties before dispatching."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          includes=()
          for props in versions/*/gradle.properties; do
            MC_VERSION=$(basename "$(dirname "$props")")
            includes+=("{\"mc_version\":\"$MC_VERSION\"}")
          done
          printf -v joined '%s,' "${includes[@]}"
          echo "matrix={\"include\":[${joined%,}]}" >> $GITHUB_OUTPUT

      # Per-version Java toolchains (17 for 1.20.1, 21 for 1.21.x, 25 for 26.1+)
      # are auto-provisioned by the foojay resolver declared in settings.gradle.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build all versions
        run: ./gradlew build collectJars --no-daemon

      - name: Generate changelog
        run: |
          mkdir -p /tmp/artifacts
          cp build/libs/*.jar /tmp/artifacts/
          rm -f /tmp/artifacts/*-sources.jar
          # On release events HEAD is the release tag itself; exclude it so the
          # range spans from the previous tag to the current commit.
          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "${{ steps.meta.outputs.tag }}" | head -1)
          {
            echo "### Changes"
            if [ -z "$PREV_TAG" ]; then
              git log HEAD --pretty=format:"- %s (%h)" --no-merges | head -50
            else
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo ""
          } > /tmp/artifacts/changelog.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-all
          path: /tmp/artifacts/

  publish-modrinth:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all
          path: /tmp/artifacts

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: vD8fMHSr
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: /tmp/artifacts/NotEnoughBandwidth-${{ needs.build.outputs.mod_version }}+${{ matrix.mc_version }}.jar
          name: Not Enough Bandwidth ${{ needs.build.outputs.mod_version }} (${{ matrix.mc_version }})
          version: ${{ needs.build.outputs.mod_version }}+${{ matrix.mc_version }}
          version-type: release
          changelog-file: /tmp/artifacts/changelog.md
          loaders: fabric
          game-versions: ${{ matrix.mc_version }}
          dependencies: |
            fabric-api(required)

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-all
          path: /tmp/artifacts

      - name: Assemble release body
        id: body
        run: |
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -d '/+=')
          {
            echo "body<<$EOF_MARKER"
            echo "Fabric API required"
            echo ""
            cat /tmp/artifacts/changelog.md
            echo "$EOF_MARKER"
          } >> $GITHUB_OUTPUT

      # On a manually published release this attaches jars and appends the
      # changelog to the existing release; on workflow_dispatch it creates the
      # tag and the release from scratch. draft/prerelease/name are left unset
      # so a user-authored release keeps its own settings and title.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.body.outputs.body }}
          append_body: true
          files: /tmp/artifacts/*.jar
