pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
        maven {
            url "https://jitpack.io"
            content { includeGroupByRegex "com\\.github\\..*" }
        }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id in ['com.replaymod.preprocess', 'com.replaymod.preprocess-root']) {
                // Canonical jitpack coordinates; the com.github.replaymod:preprocessor
                // compat path serves an empty jar for this multi-module repo, and the
                // originally pinned 221276c7d4 artifacts were evicted from jitpack.
                useModule("com.github.replaymod.preprocessor:preprocessor:${requested.version}")
            }
        }
    }
}

plugins {
    // Auto-provisions the JDK 17/21/25 toolchains when they are not installed (mainly CI).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'NotEnoughBandwidth'

// One subproject per versions/<mc> directory; all share common.gradle.
file('versions').eachDir { final File dir ->
    final String version = ":$dir.name"
    include version
    final ProjectDescriptor projectDescriptor = project(version)
    projectDescriptor.projectDir = dir
    projectDescriptor.buildFileName = '../../common.gradle'
}
